<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio</title>
<meta name="description" content="Explorations in images, 3D, music, video and games.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EDEFF4; --surface:#F8F9FC; --fg:#11141C; --muted:#586072; --line:#CDD2DE; --accent:#2B3CD1;
  --font-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0B0D12;--surface:#12151D;--fg:#E6E9F0;--muted:#979EB0;--line:#272C3A;--accent:#8F9BFF;color-scheme:dark}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.6 var(--font-body);padding:48px max(16px,env(safe-area-inset-right)) 80px max(16px,env(safe-area-inset-left))}
.page{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:40px}
h1{margin:0;font:700 clamp(36px,7vw,64px)/1 var(--font-display);letter-spacing:-.03em}
.lede{margin:14px 0 0;color:var(--muted);max-width:56ch;font-size:16px}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav button{font:500 13px var(--font-mono);color:var(--fg);background:var(--surface);border:1px solid var(--line);padding:7px 12px;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:8px;padding:18px;background:var(--surface);border:1px solid var(--line);color:inherit;text-decoration:none}
.card:hover{border-color:var(--accent)}
.card .cover{display:block;width:calc(100% + 36px);max-width:none;margin:-18px -18px 6px;aspect-ratio:16/9;object-fit:cover;background:var(--line);border-bottom:1px solid var(--line)}
.card .tag{font:500 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.card h2{margin:0;font:600 20px/1.2 var(--font-display)}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .date{margin-top:auto;font:400 12px var(--font-mono);color:var(--muted)}
.empty{color:var(--muted)}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Studio</h1>
    <p class="lede">A notebook of explorations in images, 3D, music, video and games. Each entry is a self-contained page.</p>
  </header>
  <nav id="filters" aria-label="Filter by category"></nav>
  <main id="list"></main>
</div>

<script>
// To add an exploration: put it in <category>/<slug>/index.html and add one line here.
// A 960x540 <category>/<slug>/cover.webp next to it becomes the card image.
var CATEGORIES = ['images', '3d', 'music', 'video', 'games'];
var EXPLORATIONS = [
  {
    category: 'images',
    path: 'images/halftone-dithering/',
    title: 'Halftone and Dithering Notebook',
    description: 'AM vs FM halftoning, Shepard-tone gradients, two sixteen-way sphere galleries, and real-time blue noise in three.js with a benchmark.',
    date: '2026-10'
  },
  {
    category: 'images',
    path: 'images/pixel-sprites/',
    title: 'Pixel sprites from JSON',
    description: '3D primitives on a skeleton, described in JSON. A Python script renders 8-direction walk cycles on a fixed palette.',
    date: '2026-10'
  },
  {
    category: 'images',
    path: 'images/color-lessons/',
    title: 'Color lessons from painters',
    description: 'Value structure, relative color, temperature shifts, chroma budget, mother color and OKLCH, as live demos plus a six-pass iteration lab.',
    date: '2026-10'
  },
  {
    category: 'images',
    path: 'images/sprite-recolor/',
    title: 'Re-coloring a pixel tiger',
    description: 'Six color passes on the procedural tiger (value, temperature, chroma, mother color, reference match), measured against a sampled tiger painting.',
    date: '2026-10'
  },
  {
    category: 'images',
    path: 'images/p5-brush-gallery/',
    title: 'p5.brush gallery',
    description: 'Every built-in p5.brush brush, plus stroke, fill, hatch, vector-field and custom-brush operations, drawn live with the code beside each.',
    date: '2026-10'
  },
  {
    category: 'images',
    path: 'images/shot-language/',
    title: 'The language of a shot',
    description: 'Photographic choices as a vocabulary for 2D and 3D art: shot size, angle, lens, focus, light, composition, shutter, grade. One three.js street with three characters, rendered 96 ways, plus a shot builder.',
    date: '2026-10'
  },
  {
    category: 'images',
    path: 'images/visual-structure/',
    title: 'Shape and visual structure',
    description: 'Contrast and affinity across shape, line, tone, color, space, movement and rhythm: canvas galleries, a three.js depth-cue series, a seven-dial lab and a story intensity planner.',
    date: '2026-10'
  },
  {
    category: 'images',
    path: 'images/visual-cryptography/',
    title: 'Secrets in the overlap',
    description: 'Visual cryptography as art elements: noise sheets that stack into a picture, thresholds, meaningful covers, progressive reveals, rotate/flip/fold secrets, forged shares, and a lab that exports printable transparencies.',
    date: '2026-10'
  },
  {
    category: 'images',
    path: 'images/hybrid-images/',
    title: 'Two pictures in one',
    description: 'Hybrid images and the eye\'s spatial-frequency channels: a calibrated Campbell–Robson chart to trace your own sensitivity, a picture split into bands, a hybrid maker that predicts the flip distance, and Harmon and Julesz\'s blocky portrait.',
    date: '2026-10'
  },
  {
    category: 'images',
    path: 'images/noise/',
    title: 'Randomness with a shape',
    description: 'Procedural noise beyond terrain: why gradient noise is band-limited, why fBm looks natural (with a fractal preference test), noise as shake, wander and curl flow, domain warping, and seamless loops, every spectrum measured.',
    date: '2026-10'
  },
  {
    category: 'images',
    path: 'images/voronoi/',
    title: 'Cells from seeds',
    description: 'Voronoi diagrams beyond maps: growth from seeds, distance metrics, territories that relax into hexagons and blue noise, stippling and mosaics, Worley textures, fracture, and the Delaunay dual, with the geometry checked live.',
    date: '2026-10'
  },
  {
    category: '3d',
    path: '3d/padlock-looks/',
    title: 'One scene, many looks',
    description: 'The seed-phrase vs password padlocks re-dressed with material, palette, light, camera, tone mapping and post-processing choices: toon, low-poly, neon, retro, halftone.',
    date: '2026-10'
  },
  {
    category: 'games',
    path: 'games/predator-prey/',
    title: 'Hunters and the hunted',
    description: 'Predator and prey tricks as live simulations: Lévy search, pursuit laws and the falcon\'s spiral, motion camouflage, the selfish herd, confusion and oddity, the escape repertoire, the C-start, countershading, and an arena that scores them.',
    date: '2026-10'
  },
  {
    category: 'music',
    path: 'music/consonance/',
    title: 'Why notes get along',
    description: 'Sensory consonance from the cochlea up: critical bands, the Plomp–Levelt roughness curve, overtones that pick the intervals, scales derived from timbres, tension curves, the missing fundamental, Shepard tones, and a tuning lab with Scala export.',
    date: '2026-10'
  }
];

var filter = 'all';
var nav = document.getElementById('filters');
var list = document.getElementById('list');

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}

function render() {
  nav.textContent = '';
  ['all'].concat(CATEGORIES).forEach(function (c) {
    var b = el('button', '', c);
    b.type = 'button';
    b.setAttribute('aria-pressed', String(c === filter));
    b.onclick = function () { filter = c; render(); };
    nav.appendChild(b);
  });
  list.textContent = '';
  var items = EXPLORATIONS.filter(function (x) { return filter === 'all' || x.category === filter; });
  if (!items.length) list.appendChild(el('p', 'empty', 'Nothing here yet.'));
  items.forEach(function (x) {
    var a = el('a', 'card');
    a.href = x.path;
    var img = el('img', 'cover');
    img.src = x.path + 'cover.webp';
    img.alt = '';
    img.loading = 'lazy';
    img.onerror = function () { img.remove(); };
    a.appendChild(img);
    a.appendChild(el('span', 'tag', x.category));
    a.appendChild(el('h2', '', x.title));
    a.appendChild(el('p', '', x.description));
    a.appendChild(el('span', 'date', x.date));
    list.appendChild(a);
  });
}
render();
</script>
</body>
</html>
